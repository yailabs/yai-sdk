[package]
name = "yai-sdk"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Supported local YAI client protocol and Rust SDK"
repository = "https://github.com/yailabs/yai-sdk"

[workspace]
members = [".", "crates/yvex-sdk"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
