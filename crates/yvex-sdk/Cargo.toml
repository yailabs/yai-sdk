[package]
name = "yvex-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Public YVEX client contracts in the YAI platform SDK"
repository = "https://github.com/yailabs/yai-sdk"

[features]
default = []
# Uses an explicitly supplied public native client installation. No private wire.
finite-decision-native = ["dep:bindgen", "dep:cc"]

[build-dependencies]
serde_json = "1"
bindgen = { version = "=0.72.1", optional = true, default-features = false, features = ["runtime"] }
cc = { version = "1", optional = true }

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"
tempfile = "3"
