[package]
name = "yvex-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Compatibility facade for the independently owned YVEX SDK"
repository = "https://github.com/yailabs/yai-sdk"

[features]
default = []
native-credentials = ["yvex-client/native-credentials"]
finite-decision-native = ["yvex-client/finite-decision-native"]

[dependencies]
yvex-client = { package = "yvex-sdk", version = "0.2.0", git = "https://github.com/yailabs/yvex.git", rev = "c57d333bb3a3f63d9c0d720c8016455cdeb7da41" }

[dev-dependencies]
serde_json = "1"
